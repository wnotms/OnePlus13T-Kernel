name: 编译一加 13T 内核 6.6.89

on:
  workflow_dispatch:
    inputs:
      pure_kernel:
        description: "纯净内核（开启后强制关闭所有第三方功能）"
        required: true
        default: true
        type: boolean
      root_solution:
        description: "Root 方案"
        required: true
        default: none
        type: choice
        options: [none, kernelsu_next, resukisu]
      enable_susfs:
        description: "启用 SUSFS（仅支持 ReSukiSU）"
        required: true
        default: false
        type: boolean
      enable_droidspaces:
        description: "启用 Droidspaces 容器支持"
        required: true
        default: false
        type: boolean
      enable_ntsync:
        description: "启用 NTSync 同步支持"
        required: true
        default: false
        type: boolean
      enable_scx:
        description: "启用一加 13T HMBIRD / SCX 调度器"
        required: true
        default: false
        type: boolean
      enable_bbg:
        description: "启用 BBG（Baseband Guard）"
        required: true
        default: false
        type: boolean
      enable_adios:
        description: "启用 ADIOS I/O 调度器"
        required: true
        default: false
        type: boolean

permissions:
  contents: read
  actions: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      PURE_KERNEL: ${{ inputs.pure_kernel }}
      ROOT_SOLUTION: ${{ inputs.pure_kernel && 'none' || inputs.root_solution }}
      ENABLE_SUSFS: ${{ inputs.pure_kernel && 'false' || inputs.enable_susfs }}
      ENABLE_DROIDSPACES: ${{ inputs.pure_kernel && 'false' || inputs.enable_droidspaces }}
      ENABLE_NTSYNC: ${{ inputs.pure_kernel && 'false' || inputs.enable_ntsync }}
      ENABLE_SCX: ${{ inputs.pure_kernel && 'false' || inputs.enable_scx }}
      ENABLE_BBG: ${{ inputs.pure_kernel && 'false' || inputs.enable_bbg }}
      ENABLE_ADIOS: ${{ inputs.pure_kernel && 'false' || inputs.enable_adios }}

    steps:
      - uses: actions/checkout@v6

      - name: 检查构建脚本
        run: bash -n scripts/*.sh

      - name: 释放磁盘空间
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /opt/hostedtoolcache/CodeQL || true
          df -h

      - name: 安装编译依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            bc bison flex build-essential binutils libssl-dev libelf-dev dwarves \
            git curl unzip zip ccache rsync file python3 python-is-python3 \
            lz4 zstd

      - name: 恢复 ccache 编译缓存
        uses: actions/cache@v5
        with:
          path: ~/.ccache_oneplus13t
          key: oneplus13t-6.6.89-${{ github.run_id }}
          restore-keys: oneplus13t-6.6.89-

      - name: 获取固定版本 6.6.89 内核源码
        run: bash scripts/setup_source.sh

      - name: 应用所选功能
        run: bash scripts/apply_features.sh

      - name: 编译内核
        run: bash scripts/build_kernel.sh

      - name: 打包 AnyKernel3
        run: bash scripts/package.sh

      - name: 上传编译产物
        uses: actions/upload-artifact@v7
        with:
          name: OnePlus13T-6.6.89-${{ inputs.pure_kernel && 'pure' || 'custom' }}
          path: |
            work/artifacts/
            work/build.log
          retention-days: 30
          if-no-files-found: error